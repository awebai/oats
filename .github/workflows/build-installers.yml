name: Build Installers (verify-only)

# Real green Linux+mac installer evidence on PR / on demand — WITHOUT any
# publish surface. The release matrix (release.yml desktop-build) only runs
# on a tag push, so installers were never built in PR CI; the Linux AppImage
# executableName blocker was therefore only caught by a failed real release.
# This job builds every matrix leg and uploads the artifacts to eyeball their
# names, permanently closing that blind spot. It ships nothing: no package
# upload, no GitHub release, no tag, no version bump.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/desktop/**"
      # The shared home the app imports by relative path and ships beside
      # app.asar: a change there changes every installer.
      - "packages/client/**"
      - ".github/workflows/**"

# Verify-only: read the repo, write nothing. No publish/release/attestation
# permissions exist here (contents: read is all upload-artifact needs).
permissions:
  contents: read

# Own concurrency group — must NOT reuse the release workflow's concurrency
# group, so a build-verify run can never collide with or cancel a real
# release. Superseded runs on the same ref are cancelled to avoid pile-up.
concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installers:
    strategy:
      # One leg's failure must NOT cancel the others — the whole point is
      # independent green/red evidence per platform.
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # macOS arm64: DMG + ZIP
            arch: arm64
            builder_args: --arm64
          - os: macos-14          # macOS x64 cross-build: DMG + ZIP (no sunset macos-13 dependency)
            arch: x64
            builder_args: --x64
          - os: ubuntu-latest     # Linux x64: AppImage + DEB
            arch: x64
            builder_args: --x64
    runs-on: ${{ matrix.os }}
    env:
      # Ad-hoc signed, NOT Developer ID signed and NOT notarized — disable
      # certificate discovery (same as the release matrix) so no keychain
      # identity can leak in; ad-hoc signing (electron-builder identity "-")
      # is deterministic and needs no secrets.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-builder SKIPS mac signing on pull_request builds
      # (builder-util isPullRequest() sees GITHUB_BASE_REF) unless this is
      # set — without it the PR legs ship the exact absent/partial-signature
      # defect this workflow gates against and the codesign phase fails.
      # Safe here: no signing secrets exist in this repo and the identity is
      # the deterministic ad-hoc "-" — there is nothing for a fork PR to
      # exfiltrate.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # (No xvfb / display needed: the build-verify smoke runs the static
      # inventory + strict codesign + node-pty ABI checks and the headless
      # backend/collector run as Node, not the packaged GUI launch — that needs an interactive windowserver an app without
      # Developer ID trust can't get on CI runners and is verified out of
      # band.)
      - name: Install deps (root + packages/desktop)
        run: |
          npm ci
          npm --prefix packages/desktop ci

      # macos-14 is arm64. Install Rosetta before the x64 cross-build smoke so
      # ELECTRON_RUN_AS_NODE executes the packaged x64 Electron and loads the
      # real x64 node-pty ABI (a wrong-arch native module must fail here).
      - name: Install Rosetta (macOS x64 cross-build only)
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Build ad-hoc signed installers
        working-directory: packages/desktop
        run: npm run dist -- ${{ matrix.builder_args }}

      # Contract (macos-correct-installers): BOTH packaged mac .app bundles
      # must carry a COMPLETE ad-hoc signature (v0.18.2 arm64 shipped an
      # incomplete linker-generated one — "code has no resources but signature
      # indicates they must be present" — and x64 shipped unsigned). Gate the
      # packaged app with strict deep codesign verification BEFORE smoke and
      # artifact upload. This run-block must stay byte-identical to the one in
      # release.yml (test/release-workflow.test.mjs enforces both).
      - name: Verify macOS ad-hoc signature (strict deep codesign)
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: |
          APP="$(find dist -maxdepth 2 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "::error::no packaged .app found under dist/"; exit 1; }
          echo "strict deep codesign verification: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # SPIKE (#855, never merged): the shared home (packages/client) must be
      # in every distributable, beside app.asar, with every module the
      # repository's directory has; on macOS, sealed by the bundle signature.
      # The smoke below then LOADS it from the unpacked build. The DMG is not
      # opened: it is made from the same .app the ZIP is.
      - name: "Spike: the distributables carry the shared home beside app.asar"
        working-directory: packages/desktop
        run: |
          want="$(ls ../client/*.mjs | wc -l | tr -d ' ')"
          check() {
            echo "$1: $2 of $want shared-home modules"
            [ "$2" = "$want" ] || { echo "::error::$1 carries $2 of $want shared-home modules"; exit 1; }
          }
          if [ "$RUNNER_OS" = "Linux" ]; then
            check "unpacked build (resources/client)" "$(ls dist/linux-unpacked/resources/client/*.mjs | wc -l | tr -d ' ')"
            check "DEB" "$(dpkg-deb -c dist/oats-desktop-*.deb | grep -c '/resources/client/[^/]*\.mjs$')"
            chmod +x dist/oats-desktop-*.AppImage
            IMAGE="$(ls "$PWD"/dist/oats-desktop-*.AppImage)"
            (cd "$RUNNER_TEMP" && "$IMAGE" --appimage-extract 'resources/client/*' >/dev/null)
            check "AppImage" "$(ls "$RUNNER_TEMP"/squashfs-root/resources/client/*.mjs | wc -l | tr -d ' ')"
          else
            APP="$(find dist -maxdepth 2 -name '*.app' -print -quit)"
            check ".app (Contents/Resources/client)" "$(ls "$APP"/Contents/Resources/client/*.mjs | wc -l | tr -d ' ')"
            check "ZIP" "$(unzip -Z1 dist/oats-desktop-*.zip | grep -c '/Contents/Resources/client/[^/]*\.mjs$')"
            check "signature seal (CodeResources)" "$(grep -o '<key>Resources/client/[^/<]*\.mjs</key>' "$APP/Contents/_CodeSignature/CodeResources" | sort -u | wc -l | tr -d ' ')"
          fi

      # Installed-artifact smoke, BUILD-VERIFY mode: inventory (artifact names
      # + plausible sizes) + strict deep codesign verification of the packaged
      # .app bundle (macOS legs — unconditional, rejects the v0.18.2
      # partial/absent-signature class) + node-pty under the packaged Electron
      # ABI + the bundled backend (started as main starts it, answering, then
      # exiting when its stdin closes) and its liveness collector, run
      # headless as Node from app.asar. The packaged GUI LAUNCH is skipped
      # (OATS_SMOKE_BUILD_VERIFY authorizes the skip under CI) — it needs a
      # display ad-hoc-signed apps don't get on CI runners; the installer
      # BUILD + signature + native-module ABI + headless backend are the
      # meaningful evidence here. Not the AppImage's launcher or runtime.
      - name: Installed-artifact smoke (build-verify)
        working-directory: packages/desktop
        env:
          OATS_SMOKE_SKIP_LAUNCH: "1"
          OATS_SMOKE_BUILD_VERIFY: "1"
          OATS_SMOKE_TARGET_ARCH: ${{ matrix.arch }}
        run: npm run dist:smoke

      # Upload the distributables so the produced AppImage/DEB/DMG/ZIP names
      # can be eyeballed (proves the executableName/package naming is clean).
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/desktop/dist/oats-desktop-*
          if-no-files-found: error

      # SPIKE (#855, never merged), Linux leg only: the one claim the steps
      # above cannot show. The packaged WINDOW loads the shared home: the page,
      # over file:// under its CSP, imports ../../client/ from
      # app.asar/renderer/. This is the same smoke WITH its launch phase (5),
      # unchanged, on a virtual display: neither OATS_SMOKE_SKIP_LAUNCH nor
      # OATS_SMOKE_BUILD_VERIFY is set here. `SHELL_OK nav=N` means shell.mjs
      # ran, and it statically imports two re-exports into the shared home; a
      # module graph with one file that does not load does not run at all. Last,
      # after the upload, so a red launch leaves the build-verify evidence and
      # the artifacts as they are. Not on macOS: no window comes up there (see
      # the note above the install step).
      - name: "Spike: the packaged window loads the shared home (smoke with the launch phase, Linux only)"
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        env:
          OATS_SMOKE_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          xvfb-run -a npm run dist:smoke
