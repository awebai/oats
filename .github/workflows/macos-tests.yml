# Run named test files of a named ref on a macOS runner. Started by hand, never by a push or a
# pull request. docs/macos-test-runs.md owns it: what a run is evidence of, how to start one, the
# bounds, and what a run does not show.
#
# The terms, each pinned by test/macos-tests-workflow.test.mjs:
#
#   * `workflow_dispatch` is the only trigger.
#   * The token reads contents and nothing else; no secret is named; no artifact is uploaded (the
#     logs and the step summary are all a run leaves); no cache is written or read
#     (`actions/setup-node` without `cache:`).
#   * No input is ever written into a shell line. The ref and the file list reach
#     scripts/macos-tests.mjs as environment variables, and it validates both before anything of
#     the ref is checked out, installed or run. The bounds (files a run, time a file) are that
#     script's constants, not inputs.
#   * Two trees: `runner/` is this workflow's own commit, and the script runs from it; `tested/` is
#     the ref. So a ref older than the workflow can be tested, and an honest branch cannot change
#     the runner by accident. The trees are no security boundary: from the first install step on,
#     the ref's code runs as the runner's user. Only the validation step's output is printed
#     before any of it has run.
name: macOS tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "A branch, a tag or a full commit id of this repository (not a pull request's number)"
        required: true
        type: string
      files:
        description: "Test files, separated by spaces or commas: test/**/*.test.mjs, packages/<name>/test/**/*.test.mjs (at most 10)"
        required: true
        type: string
      tmux:
        description: "Install tmux first, for tests that skip without it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A group of its own, and one per run: a run's link is evidence, so no later run may cancel it.
  # One fixed group would not do: GitHub keeps a single pending run per group and cancels it when
  # another is queued.
  group: macos-tests-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    name: Named test files on macOS
    # The image the repository's other macOS jobs use (release.yml, build-installers.yml).
    runs-on: macos-14
    # scripts/macos-tests.mjs: 10 files at 5 minutes each, and the installs before them.
    timeout-minutes: 60
    steps:
      - name: Check out the workflow's own commit
        uses: actions/checkout@v4
        with:
          path: runner
          # Every branch and tag of origin: the ref under test is looked up among them, and
          # nothing is ever fetched by the input's own text.
          fetch-depth: 0
          # The token stays out of the checkout's configuration: the ref's code runs beside it.
          persist-credentials: false

      # Node 22, as pull-request CI. No `cache:`: this workflow shares no cache with another.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Before the validation, so that its header can say whether tmux is there.
      - name: Install tmux
        if: ${{ inputs.tmux }}
        run: brew install tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"

      - name: Validate the request and check out its commit
        run: node runner/scripts/macos-tests.mjs prepare tested
        env:
          MACOS_TESTS_REF: ${{ inputs.ref }}
          MACOS_TESTS_FILES: ${{ inputs.files }}

      # From here on the ref's own code runs (its install scripts, then its tests), as
      # pull-request CI runs every branch's. The installs are pull-request CI's shards'.
      - name: Install supported-node dependencies
        run: npm ci
        working-directory: tested

      - name: Install desktop package dependencies
        run: npm ci
        working-directory: tested/packages/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run each file alone
        run: node runner/scripts/macos-tests.mjs run tested
        env:
          MACOS_TESTS_REF: ${{ inputs.ref }}
          MACOS_TESTS_FILES: ${{ inputs.files }}
