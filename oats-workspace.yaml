schemaVersion: 2
name: oats

# The official OATS development workspace (workspace model v2). Every framework
# repository is a member: it backlinks here with its own oats-membership.yaml, and
# its souls/ and capabilities/ are discovered at its latest default-branch state.
# The package repositories are ALSO package publishers; what they publish is
# consumed only through `packages:` below (member and publisher never collapse).
members:
  - git:github.com/awebai/oats          # the host is a member too
  - git:github.com/awebai/oats-dev
  - git:github.com/awebai/oats-okf
  - git:github.com/awebai/oats-aweb
  - git:github.com/awebai/oats-authoring
  - git:github.com/awebai/oats-jira
  - git:github.com/awebai/oats-linear

# The only versioned things. Bare versions resolve through the official catalog
# (package-catalog.json in this repository); oats-lock.json records commit and
# integrity, and executables are approved once per version.
packages:
  oats.framework: v1.1.3
  oats.okf: v2.1.4
  oats.aweb: v1.12.0
  oats.jira: v1.0.0
  oats.linear: v1.0.0
  oats.authoring: v1.0.0
  oats.dev: v1.0.0

teams:
  global: { description: The framework's expert souls and its package experts }

# The framework's own souls consume the official core and knowledge provider as
# packages, exactly as an adopter does.
defaults:
  capabilities:
    oats.core: { from: package }
  knowledge: { oats.okf: { from: package } }
  tasks: none

# The central knowledge base. Where the base sits inside the repository (and the
# host state it needs) is the knowledge provider's binding, on each machine.
stores:
  oats: git:github.com/awebai/oats-knowledge
