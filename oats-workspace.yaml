schemaVersion: 2
name: oats

# The official OATS development workspace (workspace model v2). Every framework
# repository is a member: it backlinks here with its own oats-membership.yaml, and
# its souls/ and capabilities/ are discovered at its latest default-branch state.
# The package repositories are ALSO package publishers; what they publish is
# consumed only through `packages:` below (member and publisher never collapse).
members:
  - git:github.com/awebai/oats          # the host is a member too
  - git:github.com/awebai/oats-dev
  - git:github.com/awebai/oats-okf
  - git:github.com/awebai/oats-aweb
  - git:github.com/awebai/oats-authoring
  - git:github.com/awebai/oats-jira
  - git:github.com/awebai/oats-linear

# The only versioned things. Bare versions resolve through the official catalog
# (package-catalog.json in this repository). Declaring a package here is the
# decision to trust it; oats-lock.json records its commit and integrity.
packages:
  oats.framework: v1.1.3
  oats.okf: v2.1.5
  oats.aweb: v1.14.1
  oats.jira: v1.0.1
  oats.linear: v1.0.1
  oats.authoring: v1.0.3
  oats.dev: v1.0.1

teams:
  global: { description: The framework's expert souls and its package experts }

# The framework's own souls consume the official core, knowledge and messaging
# providers as packages, exactly as an adopter does. Every soul gets messaging:
# review asks and coordination arrive by mail. A soul opts out with
# `messaging: none` in its soul.yaml.
defaults:
  capabilities:
    oats.core: { from: package }
  knowledge: { oats.okf: { from: package } }
  messaging: { oats.aweb: { from: package } }
  tasks: none

# Knowledge stores. The provider does not read this block; each machine binds
# the bases in its knowledge bindings file. The store names below are also the
# BASE ALIASES the souls' okf.json files commit to ("oats/<node>",
# "aweb/<node>"), so every machine must bind them under exactly these names:
#   oats → the OATS central base   (root knowledge/, accepted branch main)
#   aweb → the aweb project's base, read-only (root knowledge/, accepted branch main)
stores:
  oats: git:github.com/awebai/oats-knowledge
  aweb: git:github.com/awebai/aweb
