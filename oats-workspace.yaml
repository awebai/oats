schemaVersion: 1
name: oats-development

# Membership is reciprocal discovery, not capability activation or enrollment.
# Omitted revisions use the hosting provider's observed default branch; there is
# no guessed main branch or circular future workspace/member commit pin.
members:
  - source: git:github.com/awebai/oats
  - source: git:github.com/awebai/oats-dev
  - source: git:github.com/awebai/oats-okf
  - source: git:github.com/awebai/oats-aweb
  - source: git:github.com/awebai/oats-authoring
  - source: git:github.com/awebai/oats-jira
  - source: git:github.com/awebai/oats-linear

defaults:
  tasks: none

# Messaging: every human operator gets their own private team (the accepted default
# policy). Declaring it here is what lets a messaging-enabled edition normalize in
# workspace context; it does not enroll anyone or name a team id.
teams:
  private: per-human

# Imports pin the six framework soul editions exported by this same repository at the
# released v0.24.3 revision (explicit oats.core, oats.okf@v2.1.1, oats.aweb@v1.11.0). Importing is selection, not activation, enrollment or approval.
imports:
  - source: git:github.com/awebai/oats
    soul: souls/oats-expert
    revision: 3156e4de23a02b0de86a45b2471cb893cd8f75db
    alias: oats-expert
  - source: git:github.com/awebai/oats
    soul: souls/oats-kernel-expert
    revision: 3156e4de23a02b0de86a45b2471cb893cd8f75db
    alias: oats-kernel-expert
  - source: git:github.com/awebai/oats
    soul: souls/oats-desktop-expert
    revision: 3156e4de23a02b0de86a45b2471cb893cd8f75db
    alias: oats-desktop-expert
  - source: git:github.com/awebai/oats
    soul: souls/market-research-expert
    revision: 3156e4de23a02b0de86a45b2471cb893cd8f75db
    alias: market-research-expert
  - source: git:github.com/awebai/oats
    soul: souls/oats-assistant
    revision: 3156e4de23a02b0de86a45b2471cb893cd8f75db
    alias: oats-assistant
  - source: git:github.com/awebai/oats
    soul: souls/oats-setup-expert
    revision: 3156e4de23a02b0de86a45b2471cb893cd8f75db
    alias: oats-setup-expert
