schemaVersion: 1
name: oats-desktop-expert
description: "Desktop product/interaction rationale, accessibility, integration limitations and verification judgment."
work: directory
requires:
  capabilities:
    oats.core:
      # Day-to-day OATS operation (oats-operate, oats-souls). Explicit and removable;
      # retained from this repository's oats-package at the same reviewed revision.
      source: repo:oats-package
  knowledge:
    capability: oats.okf
    source: git:github.com/awebai/oats-okf@v2.1.1#oats-package
  messaging:
    capability: oats.aweb
    source: git:github.com/awebai/oats-aweb@v1.11.0#oats-package
defaults:
  tasks: none
# Messaging declaration consumed by the selected provider: no wider team memberships
# requested; the operator's private per-human team (workspace policy) is the only one.
teams: []
knowledge:
  contract: oats.okf.locations
  version: 1
  payload:
    owner: 76085278-3874-4382-9f7a-f11de3dbceb4
    stores:
      oats:
        inherit: stores.oats
    owns:
      - node: oats-desktop-expert
        destination: oats
    reads:
      - store: oats
        node: oats-expert
      - store: oats
        node: oats-kernel-expert
      - store: oats
        node: market-research-expert
      - store: oats
        node: oats-assistant
