schemaVersion: 1
name: oats-assistant
description: "Persistent deployment-owned onboarding expertise, practical adoption/configuration and expert handoff."
work: directory
requires:
  knowledge:
    capability: oats.okf
    source: git:github.com/awebai/oats-okf@v2.1.0#oats-package
  messaging:
    capability: oats.aweb
    source: git:github.com/awebai/oats-aweb@v1.10.3#oats-package
defaults:
  tasks: none
knowledge:
  contract: oats.okf.locations
  version: 1
  payload:
    owner: 2dab92c7-701d-4101-bc7f-09acf4fc374e
    stores:
      oats:
        inherit: stores.oats
    owns:
      - node: oats-assistant
        destination: oats
    reads:
      - store: oats
        node: oats-expert
      - store: oats
        node: oats-kernel-expert
      - store: oats
        node: oats-desktop-expert
      - store: oats
        node: market-research-expert
