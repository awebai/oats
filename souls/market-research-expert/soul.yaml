schemaVersion: 1
name: market-research-expert
description: "Dated attributable research, fair scoped comparisons and positioning evidence; no facts invented."
work: directory
requires:
  knowledge:
    capability: oats.okf
    source: git:github.com/awebai/oats-okf@v2.1.0#oats-package
  messaging:
    capability: oats.aweb
    source: git:github.com/awebai/oats-aweb@v1.10.3#oats-package
defaults:
  tasks: none
knowledge:
  contract: oats.okf.locations
  version: 1
  payload:
    owner: 2a073e37-2114-474d-917d-29cf3333932f
    stores:
      oats:
        inherit: stores.oats
    owns:
      - node: market-research-expert
        destination: oats
    reads:
      - store: oats
        node: oats-expert
      - store: oats
        node: oats-kernel-expert
      - store: oats
        node: oats-desktop-expert
      - store: oats
        node: oats-assistant
