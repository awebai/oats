schemaVersion: 2
name: oats-kernel-expert
description: "Kernel-to-capability contract rationale, deliberate constraints, compatibility and trust tradeoffs."
work: directory
# oats.core and the oats.okf knowledge slot come from the workspace defaults.
# What this soul owns and reads in the central base is okf.json beside this file.
capabilities:
  oats.engineering-expert: { from: package }   # plan, spec, coordinate developers and experts, verify, land
  oats.workspace-experts: { from: here }       # this repository's surfaces, developers and delivery
  oats.cloning: { from: package }   # request a clone of an instance for a new goal
launch: { harness: claude, model: claude-opus-5-5 }   # the role's preference; each machine may override it
