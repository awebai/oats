schemaVersion: 2
name: oats-desktop-developer
description: "OATS Desktop developer: builds all of packages/desktop (the Electron app, its renderer views, styles and themes, its bundled backend, packaging and release automation)."
# A developer: its product is reviewed changes on its own branch.
work: worktree
# oats.core and messaging come from the workspace defaults. A developer has no knowledge
# capability: what it learns goes into the repository's development docs and code comments.
knowledge: none
capabilities:
  oats.developer: { from: package }   # spec, parallel execution, consolidation, the code-reviewer loop
  oats.desktop-ui: { from: here }     # accessible Desktop interactions and live Electron verification
launch: { harness: claude, model: claude-opus-5-5 }   # the role's preference; each machine may override it
