      description: Optional knowledge-theory capability and authoring expert.
    - path: capabilities/oats-authoring
      description: Contained authoring capability package; not an implicit workspace default.

# No knowledge export: the phase-2 corpus, visibility and acceptance are separate.
# Public source imports do not follow this workspace backlink as adopter policy.
