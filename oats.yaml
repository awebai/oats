schemaVersion: 1
workspace:
  source: git:github.com/awebai/oats

exports:
  souls:
    - path: souls/oats-expert
      definition: souls/oats-expert/soul.yaml
      description: Transitional portable edition of the existing OATS framework expert.
  packages:
