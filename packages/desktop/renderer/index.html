<!doctype html>
<html data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'sha256-0Jdk9tmT9Tt8cjZwiacnC7eiFpnP3st50xHv+9r+lAw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>OATS Desktop</title>
  <script type="importmap">
  { "imports": {
      "marked": "../node_modules/marked/lib/marked.esm.js",
      "dompurify": "../node_modules/dompurify/dist/purify.es.mjs",
      "highlight.js": "./vendor/highlight.mjs"
  } }
  </script>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="loading.css" />
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <!-- Two sections, each a plain heading over its list: Workspaces (with Add local workspace…), the main views
           under its list, then Instances (with Spawn instance). The foot: the OATS mark, then the sidebar toggle and
           the settings cog at its right end. -->
      <div class="ctx-head ws-head">
        <span id="ws-heading" class="ws-heading">Workspaces</span>
        <button id="ws-add-open" class="ws-add-open side-icon-button icon-button" type="button" aria-label="Add local workspace…" title="Add local workspace…"></button>
      </div>
      <!-- The workspace list (workspace-switcher.mjs): always shown, one row per workspace, a list of buttons. -->
      <section id="ws-list" class="ws-list" aria-labelledby="ws-heading">
        <div id="ws-options" class="ws-options"></div>
      </section>
      <!-- The current workspace's own section: the main views (shell-nav.mjs NAV), then its instances. -->
      <section id="ws-current" class="ws-current" aria-label="Current workspace">
        <nav id="nav" aria-label="Main views"></nav>
        <section id="instance-roster" aria-label="Instances">
          <div class="ctx-head"><span>Instances</span><span class="ctx-count"></span><button id="sidebar-spawn" class="side-icon-button ctx-head-add icon-button"
            type="button" data-action="app.chooseSoul" title="Spawn instance" aria-label="Spawn instance"><span data-shell-icon="plus" aria-hidden="true"></span></button></div>
          <div class="ctx-list"></div>
        </section>
      </section>
      <!-- The foot: the OATS mark (decorative), then the sidebar toggle and the settings cog (sidebar-settings.mjs
           builds its menu). -->
      <div id="nav-foot" role="group" aria-label="Sidebar tools">
        <span class="sidebar-brand" aria-hidden="true"><img class="sidebar-brand-image" src="../assets/brand/generated/sidebar-48.png" width="20" height="20" alt="" draggable="false"></span>
        <button id="sidebar-toggle" class="side-icon-button icon-button" type="button" data-action="sidebar.toggle"
                title="Hide the sidebar" aria-label="Hide the sidebar" aria-controls="sidebar" aria-expanded="true"><span data-shell-icon="sidebar" aria-hidden="true"></span></button>
        <button id="sidebar-settings" class="side-icon-button sidebar-settings icon-button" type="button" aria-label="Settings" title="Settings"></button>
      </div>
    </aside>
    <div id="workbench">
    <main id="main">
      <!-- Spec B: a closed sidebar or panel leaves nothing behind; these reopen them from the top bar's two ends. -->
      <button id="show-sidebar" class="main-edge-control" type="button" data-action="sidebar.toggle" hidden
              title="Show sidebar" aria-label="Show sidebar" aria-controls="sidebar" aria-expanded="false"><span data-shell-icon="sidebar" aria-hidden="true"></span></button>
      <div id="tabstrip">
        <div id="tabbar-row">
          <div id="tabbar" role="tablist" aria-label="Open terminals and artifacts"></div>
          <div id="tab-actions" hidden>
          <button id="split-right" type="button" data-action="split.vertical"
                  title="Split terminal right (side by side)" aria-label="Split terminal right"><span data-shell-icon="splitRight" aria-hidden="true"></span></button>
          <button id="split-down" type="button" data-action="split.horizontal"
                  title="Split terminal down (stacked)" aria-label="Split terminal down"><span data-shell-icon="splitDown" aria-hidden="true"></span></button>
          </div>
        </div>
      </div>
      <div id="stagehost"></div>
      <div id="tabhost" style="display:none"></div>
      <button id="show-panel" class="main-edge-control" type="button" data-action="panel.toggle" hidden
              title="Show instance panel" aria-label="Show instance panel" aria-controls="context-panel" aria-expanded="false"><span data-shell-icon="panel" aria-hidden="true"></span><span class="main-edge-dot" aria-hidden="true" hidden></span></button>
    </main>
    <aside id="context-panel" aria-label="Selection details" hidden></aside>
    </div>
  </div>
  <div id="ws-modal" class="ws-modal" hidden>
    <section class="ws-dialog" role="dialog" aria-modal="true" aria-labelledby="ws-dialog-title" aria-describedby="ws-dialog-status">
      <header class="ws-dialog-head">
        <div><span class="side-kicker">OATS desktop</span><h2 id="ws-dialog-title">Add local workspace</h2></div>
        <button id="ws-dialog-close" class="icon-button" type="button" aria-label="Close Add local workspace" data-shell-icon="close"></button>
      </header>
      <p class="ws-dialog-intro">Choose a discovered OATS workspace or browse for another folder.</p>
      <input id="ws-suggestion-search" type="search" placeholder="Filter suggestions…" autocomplete="off" aria-label="Filter suggested OATS workspaces">
      <p id="ws-dialog-status" class="ws-dialog-status" aria-live="polite" tabindex="-1"></p>
      <div id="ws-suggestions" class="ws-suggestions" role="group" aria-label="Suggested OATS workspaces"></div>
      <footer class="ws-dialog-foot">
        <button id="ws-browse" class="secondary" type="button">Browse…</button>
        <span class="ws-dialog-spacer"></span>
        <button id="ws-cancel" class="secondary" type="button">Cancel</button>
        <button id="ws-confirm" class="primary" type="button" hidden disabled>Onboard</button>
      </footer>
    </section>
  </div>
  <script type="module" src="shell.mjs"></script>
</body>
</html>
