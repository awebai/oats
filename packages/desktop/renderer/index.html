<!doctype html>
<html data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'sha256-0Jdk9tmT9Tt8cjZwiacnC7eiFpnP3st50xHv+9r+lAw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>OATS Desktop</title>
  <script type="importmap">
  { "imports": {
      "marked": "../node_modules/marked/lib/marked.esm.js",
      "dompurify": "../node_modules/dompurify/dist/purify.es.mjs",
      "highlight.js": "./vendor/highlight.mjs"
  } }
  </script>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="shell.css" />
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <button id="ws-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="ws-menu">
          <span class="ws-brand-mark" data-shell-icon="oats" aria-hidden="true"></span>
          <span class="ws-heading-copy"><span id="ws-name">Resolving…</span><span id="ws-context"></span></span>
          <span class="ws-chevron" data-shell-icon="chevron" aria-hidden="true"></span>
        </button>
      </div>
      <div id="ws-menu" class="ws-menu" hidden>
        <input id="ws-menu-search" type="search" placeholder="Find workspace…" autocomplete="off" aria-label="Find an added workspace">
        <div id="ws-options" class="ws-options" role="listbox" aria-label="Added workspaces"></div>
        <button id="ws-add-open" class="ws-add-open" type="button"><span aria-hidden="true">＋</span> Add local workspace…</button>
      </div>
      <nav id="nav" aria-label="Main views"></nav>
      <section id="instance-roster" aria-label="Instances">
        <div class="ctx-head"><span>Instances</span><span class="ctx-count"></span></div>
        <label class="ctx-filter-field">
          <input class="ctx-filter" placeholder="Filter instances…" autocomplete="off" aria-label="Filter instances"
                 data-action="sidebar.focusFilter" title="Focus the instance roster filter">
          <kbd class="shortcut-hint" data-shortcut="sidebar.focusFilter" aria-hidden="true" hidden></kbd>
        </label>
        <div class="ctx-list"></div>
      </section>
      <div id="nav-foot">
        <button id="sidebar-spawn" class="primary" type="button" data-action="app.chooseSoul"
                title="Choose a soul in Workspace to spawn an instance" aria-label="Spawn instance: choose a soul in Workspace">
          <span data-shell-icon="plus" aria-hidden="true"></span><span>Spawn instance</span>
          <kbd class="shortcut-hint" data-shortcut="app.chooseSoul" aria-hidden="true" hidden></kbd>
        </button>
        <div id="sidebar-tools" role="group" aria-label="Desktop tools">
          <button id="sidebar-toggle" class="nav-item icon-button" type="button" data-action="sidebar.toggle"
                  title="Hide the sidebar" aria-label="Hide the sidebar" aria-controls="sidebar" aria-expanded="true"><span data-shell-icon="sidebar" aria-hidden="true"></span></button>
          <button id="sidebar-theme" class="nav-item icon-button" type="button" data-action="app.themeToggle"
                  title="Toggle light/dark theme" aria-label="Toggle light/dark theme"><span data-shell-icon="theme" aria-hidden="true"></span></button>
          <button id="sidebar-shortcuts" class="nav-item icon-button" type="button" data-action="app.shortcuts"
                  title="Edit keyboard shortcuts" aria-label="Edit keyboard shortcuts"><span data-shell-icon="shortcuts" aria-hidden="true"></span></button>
          <button id="sidebar-settings" class="nav-item icon-button" type="button" data-action="app.connections"
                  title="Settings: Connections" aria-label="Settings: Connections"><span data-shell-icon="settings" aria-hidden="true"></span></button>
          <button id="sidebar-palette" class="nav-item icon-button" type="button" data-action="app.palette"
                  title="Open the command palette" aria-label="Open the command palette"><span data-shell-icon="palette" aria-hidden="true"></span></button>
        </div>
      </div>
    </aside>
    <button id="sidebar-restore" type="button" data-action="sidebar.toggle"
            title="Show the sidebar" aria-label="Show the sidebar" aria-controls="sidebar" aria-expanded="true"><span data-shell-icon="sidebar" aria-hidden="true"></span></button>
    <div id="workbench">
    <main id="main">
      <div id="tabstrip">
        <div id="tabbar-row">
          <div id="tabbar" role="tablist" aria-label="Open terminals and artifacts"></div>
          <div id="tab-actions" hidden>
          <button id="split-right" type="button" data-action="split.vertical"
                  title="Split terminal right (side by side)" aria-label="Split terminal right"><span data-shell-icon="splitRight" aria-hidden="true"></span></button>
          <button id="split-down" type="button" data-action="split.horizontal"
                  title="Split terminal down (stacked)" aria-label="Split terminal down"><span data-shell-icon="splitDown" aria-hidden="true"></span></button>
          <button id="split-close" type="button" data-action="split.close"
                  title="Close the split (back to single pane)" aria-label="Close the split"><span data-shell-icon="splitClose" aria-hidden="true"></span></button>
          </div>
        </div>
      </div>
      <div id="stagehost"></div>
      <div id="tabhost" style="display:none"></div>
      <footer id="context-tools" aria-label="Workspace layout">
        <button id="panel-toggle" type="button" data-action="panel.toggle" title="Toggle the context panel"
                aria-controls="context-panel" aria-expanded="false" disabled>Details</button>
        <button id="focus-mode-toggle" type="button" data-action="app.focusMode" title="Toggle focus mode"
                aria-pressed="false">Focus mode</button>
      </footer>
    </main>
    <aside id="context-panel" aria-label="Selection details" hidden></aside>
    </div>
  </div>
  <div id="ws-modal" class="ws-modal" hidden>
    <section class="ws-dialog" role="dialog" aria-modal="true" aria-labelledby="ws-dialog-title" aria-describedby="ws-dialog-status">
      <header class="ws-dialog-head">
        <div><span class="side-kicker">OATS desktop</span><h2 id="ws-dialog-title">Add workspace</h2></div>
        <button id="ws-dialog-close" class="icon-button" type="button" aria-label="Close add workspace dialog">×</button>
      </header>
      <p class="ws-dialog-intro">Choose a discovered OATS workspace or browse for another folder.</p>
      <input id="ws-suggestion-search" type="search" placeholder="Filter suggestions…" autocomplete="off" aria-label="Filter suggested OATS workspaces">
      <p id="ws-dialog-status" class="ws-dialog-status" aria-live="polite" tabindex="-1"></p>
      <div id="ws-suggestions" class="ws-suggestions" role="radiogroup" aria-label="Suggested OATS workspaces"></div>
      <footer class="ws-dialog-foot">
        <button id="ws-browse" class="secondary" type="button">Browse…</button>
        <span class="ws-dialog-spacer"></span>
        <button id="ws-cancel" class="secondary" type="button">Cancel</button>
        <button id="ws-confirm" class="primary" type="button" disabled>Add workspace</button>
      </footer>
    </section>
  </div>
  <script type="module" src="shell.mjs"></script>
</body>
</html>
